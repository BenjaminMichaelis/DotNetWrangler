name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The test project targets net8.0, so its runtime is required alongside the build SDK.
          dotnet-version: |
            8.0.x
            11.0.100
      - name: Lint GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 .github/workflows/*.yml
      - name: Restore
        run: dotnet restore DotNetWrangler.slnx
      - name: Build
        run: dotnet build DotNetWrangler.slnx --configuration Release --no-restore -warnaserror
      - name: Test
        run: >-
          dotnet test DotNetWrangler.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
      - name: Verify compiler-host analyzer loading
        run: pwsh -File .github/scripts/verify-analyzer-consumer.ps1
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
      - name: Create failed-test playlist
        if: failure() && hashFiles('TestResults/*.trx') != ''
        uses: BenjaminMichaelis/trx-to-vsplaylist@86a717b0e00d014347c0f16759127ae012154be7 # v4
        # The action's pre step always runs and fails installing other SDK channels on Windows,
        # so reuse the installed SDK and roll the net10.0 tool forward onto it.
        env:
          DOTNET_ROLL_FORWARD: Major
        with:
          dotnet-version: "11.0"
          trx-file-path: TestResults/*.trx
          test-outcomes: Failed
          artifact-name: failed-tests-playlist-${{ matrix.os }}
      - name: Pack and smoke-test analyzer package
        if: matrix.os == 'ubuntu-latest'
        env:
          PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
          REPOSITORY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          dotnet pack src/Wrangler.Package/Wrangler.Package.csproj \
            --configuration Release \
            --output artifacts \
            "-p:Version=$PACKAGE_VERSION" \
            "-p:RepositoryCommit=$REPOSITORY_COMMIT"

          consumer="$RUNNER_TEMP/wrangler-package-consumer"
          mkdir -p "$consumer"
          cat > "$consumer/Consumer.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <RestoreAdditionalProjectSources>$GITHUB_WORKSPACE/artifacts</RestoreAdditionalProjectSources>
              <RestorePackagesPath>$RUNNER_TEMP/wrangler-package-consumer/packages</RestorePackagesPath>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="DotNetWrangler.Analyzers" Version="$PACKAGE_VERSION" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$consumer/.editorconfig" <<'EOF'
          root = true
          [*.cs]
          dotnet_diagnostic.WRANGLER0001.severity = error
          EOF
          cat > "$consumer/Consumer.cs" <<'EOF'
          public static class Consumer
          {
              public static int GetValue()
              {
                  int value = 42;
                  return value;
              }
          }
          EOF
          build_log="$RUNNER_TEMP/wrangler-package-consumer.log"
          if dotnet build "$consumer/Consumer.csproj" --configuration Release >"$build_log" 2>&1; then
            cat "$build_log"
            echo "::error::The package failed to report WRANGLER0001 to a consumer project."
            exit 1
          fi
          if ! grep -Fq 'error WRANGLER0001:' "$build_log"; then
            cat "$build_log"
            echo "::error::The consumer build failed without reporting WRANGLER0001."
            exit 1
          fi
          echo "The packaged analyzer reports WRANGLER0001 to a consuming project."
