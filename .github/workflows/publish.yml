name: Publish to NuGet

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "5 10 * * *"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - name: Determine package version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          tag_pattern="^v($number\.$number\.$number)(-$identifier(\.$identifier)*)?$"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if ! [[ "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not a vMAJOR.MINOR.PATCH[-prerelease] version."
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            release_notes="Source for this version: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME"
          else
            deployments=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/deployments?environment=release&sha=$GITHUB_SHA" \
              --jq '.[].id')
            for deployment in $deployments; do
              states=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" --jq '.[].state')
              if grep -qx success <<< "$states"; then
                echo "::notice::This commit already published to NuGet."
                exit 0
              fi
            done

            base=""
            tags=$(git tag --list --sort=-version:refname 'v*')
            while IFS= read -r tag; do
              if [[ "$tag" =~ $tag_pattern ]]; then
                base="${BASH_REMATCH[1]}"
                break
              fi
            done <<< "$tags"
            if [[ -z "$base" ]]; then
              echo "::notice::No version tag found. Publish a tagged release before publishing nightly betas."
              exit 0
            fi
            if git show-ref --verify --quiet "refs/tags/v$base"; then
              IFS=. read -r major minor patch <<< "$base"
              base="$major.$minor.$((patch + 1))"
            fi
            version="$base-beta.$GITHUB_RUN_NUMBER"
            release_notes="Nightly beta from main commit $GITHUB_SHA."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_notes=$release_notes" >> "$GITHUB_OUTPUT"
      - name: Set up .NET
        if: steps.version.outputs.version != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            11.0.100
      - name: Test
        if: steps.version.outputs.version != ''
        run: dotnet test DotNetWrangler.slnx -c Release
      - name: Pack
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ steps.version.outputs.release_notes }}
        run: >-
          dotnet pack src/Wrangler.Package/Wrangler.Package.csproj
          -c Release -o artifacts
          "-p:Version=$VERSION"
          "-p:PackageReleaseNotes=$RELEASE_NOTES"
          "-p:RepositoryCommit=$GITHUB_SHA"
      - name: Upload package
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: pack
    if: needs.pack.outputs.version != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.nuget.org/packages/DotNetWrangler.Analyzers/${{ needs.pack.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: artifacts
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
